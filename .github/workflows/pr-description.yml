name: PR description

# This repository squash-merges using the PR title and description, so the
# description is the commit message that lands on main. This holds every pull
# request to what such a message needs: no review notes still attached, no
# line wider than the commit will keep, and no code span the wrap has broken.
#
# Every rule is asked of a draft too, which is why nothing here reads
# `draft`. Deferring one would leave the last completed run of this check
# having passed without looking, and a required check counts a pass however
# it was reached, so there is a window after a draft is marked ready where
# the description has not been read and the merge box is already green. It is
# seconds wide and auto-merge would take it. A draft carrying its notes
# therefore reports red for as long as it carries them, which is what a
# description that is not yet a commit message should say.
#
# What no arrangement here can hold is an edit made between the last run and
# the merge. The description is mutable and this check is pinned to a commit,
# while the squash message is read at merge time, so a body changed in that
# gap lands unread.
#
# Its own workflow rather than a job in CI, because the events that matter
# here are `edited` and `ready_for_review`, which fire on every touch of a
# description. Adding those to CI would run the four-agent matrix to check one
# string, and a typo fixed in prose would cost minutes of build.
on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  ready_to_be_a_commit_message:
    name: The description is ready to be a commit message
    runs-on: ubuntu-latest
    steps:
      # The description reaches the script through the environment rather than
      # interpolated into it. One is written by whoever opened the PR, and
      # `${{ }}` pastes it in as shell source, where a body carrying backticks
      # or `$(...)` would run as commands on the runner.
      #
      # The match is anchored to the start of a line, which is the difference
      # between a section and a mention: a description explaining this
      # convention names the marker in prose, and `4a3f309` is one that does.
      - name: "Check: no draft notes survive into the description"
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          # Check the description for a '## Draft notes' heading.
          if printf '%s\n' "$BODY" | grep -q '^## Draft notes'; then
            echo "ERROR: the description still has a '## Draft notes'"
            echo "section."
            echo
            echo "That description is the squash commit message, so the"
            echo "section would land on main. Delete the marker and"
            echo "everything below it before marking the PR ready."
            echo
            echo "A draft is where those notes belong, so this is expected"
            echo "to fail for as long as they are there. It is asked of a"
            echo "draft anyway: a run that passed without looking would"
            echo "leave the merge box green for the seconds between marking"
            echo "ready and the real check reporting."
            exit 1
          fi
          echo "No draft notes in the description."

      # Carriage returns are stripped first because a description arrives with
      # CRLF endings, and counting the `\r` would report every line at its
      # width plus one and fail a description that is exactly right.
      - name: "Check: no line is too wide for the commit message"
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          # Measure every line of the description against 72 columns.
          too_wide=$(printf '%s\n' "$BODY" | tr -d '\r' \
            | awk 'length > 72 { print "  line " NR ": " length " columns" }')
          if [ -n "$too_wide" ]; then
            echo "ERROR: the description has lines past 72 columns:"
            printf '%s\n' "$too_wide"
            echo
            echo "GitHub hard-wraps the description when it builds the squash"
            echo "commit, breaking each line on its own rather than reflowing"
            echo "the paragraph, so each of these lands as 72 characters and"
            echo "an orphan fragment on the line below."
            exit 1
          fi
          echo "Every line fits the commit message."

      # The same wrap, biting a second way. A description is prose with code
      # in it, and the wrap does not know the difference: a span broken across
      # it keeps its backticks and arrives as a command or an identifier cut
      # in half, and a name split mid-word is one nobody can grep for.
      #
      # An odd number of backticks on a line is what a machine can see of
      # that. Fenced blocks are skipped, so a delimiter and the lines under it
      # are not read as spans that never close, which is what keeps this exact
      # rather than a guess about correct text.
      - name: "Check: no code span is broken across the wrap"
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          # Find lines carrying an odd number of backticks.
          unterminated=$(printf '%s\n' "$BODY" | tr -d '\r' \
            | awk '
                /^[[:space:]]*```/ { fenced = !fenced; next }
                fenced { next }
                gsub(/`/, "`") % 2 { print "  line " NR ": " $0 }
              ')
          if [ -n "$unterminated" ]; then
            echo "ERROR: the description breaks a code span across lines:"
            printf '%s\n' "$unterminated"
            echo
            echo "Backticks land in the squash commit as written, so whatever"
            echo "is inside them arrives cut in half and nobody can grep for"
            echo "it. Rewrap the paragraph so each span stays on one line."
            exit 1
          fi
          echo "Every code span survives the wrap."
