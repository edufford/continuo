name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint, test, and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (includes the determinism smoke test)
        run: cargo test --workspace

      - name: Determinism smoke test (explicit)
        run: cargo test -p continuo-actors --test determinism -- --nocapture

      - name: Run the traffic demo
        run: cargo run -p continuo-actors --example traffic
