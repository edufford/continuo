name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint, test, and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Ordered cheapest first, so an unformatted file is reported in seconds
      # rather than after the workspace has been compiled. Steps only run when
      # every earlier one succeeded.
      - name: "Lint: format"
        run: cargo fmt --all --check

      # The viewer installs with plain `pip`, not `uv`. `uv.lock` is committed
      # as a convenience and nothing requires it, so installing the ordinary
      # way is what keeps that true.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: "Install: viewer"
        working-directory: python
        run: python -m pip install -e . pytest ruff

      - name: "Lint: ruff"
        working-directory: python
        run: |
          ruff check .
          ruff format --check .

      - name: "Lint: clippy"
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Catches broken intra-doc links, which nothing else does: the crates
      # cross-reference each other heavily, and a renamed item leaves a link
      # that still compiles.
      - name: "Lint: docs"
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # `--lib` and `--test '*'` partition the suite: the first runs the unit
      # tests inside each lib, the second the integration targets in tests/.
      # Note `--tests` would *not* work as the second half, because it
      # includes lib unit tests too, so the two steps would re-run them.
      - name: "Test: unit"
        run: cargo test --workspace --lib

      - name: "Test: integration"
        run: cargo test --workspace --test '*'

      - name: "Test: viewer"
        working-directory: python
        run: pytest -v

      # Smoke steps run the shipped examples end to end, covering what the
      # test suites cannot: that the examples themselves build and run, and
      # that the artefacts one produces are what the next consumes. They are
      # ordered and share state, since the log recorded below is read by both
      # steps after it. A failure aborts the rest of the job, because steps
      # only run when every earlier one succeeded.
      #
      # New end-to-end checks belong here, with the same "Smoke:" prefix.
      - name: "Smoke: traffic demo"
        run: cargo run -p continuo-examples --example traffic

      - name: "Smoke: record a run and verify the unmodified log"
        shell: bash
        run: |
          cargo run -q -p continuo-examples --example traffic_record -- ci-run.jsonl
          cargo run -q -p continuo-examples --example traffic_verify -- ci-run.jsonl

      - name: "Smoke: verification detects a modified log"
        shell: bash
        run: |
          # Corrupt one pose x-coordinate mid-run, at the first match on or
          # after line 6000 (roughly sim time 14 s of 30), keeping the JSON
          # valid, so verification checks a long clean prefix before
          # diverging (and stops there rather than running to completion).
          awk 'NR>=6000 && !done && /"x":/ { sub(/"x":[-0-9.eE]*/, "\"x\":99.9"); done=1 } { print }' \
            ci-run.jsonl > ci-tampered.jsonl
          if cmp -s ci-run.jsonl ci-tampered.jsonl; then
            echo "ERROR: awk matched nothing, log was NOT modified; this check would be vacuous"
            exit 1
          fi
          echo "OK: log modified (one pose x-coordinate corrupted to 99.9)"
          if cargo run -q -p continuo-examples --example traffic_verify -- ci-tampered.jsonl; then
            echo "ERROR: verification PASSED on the modified log; divergence was NOT detected"
            exit 1
          fi
          echo "OK: verification failed with nonzero exit; divergence detected as expected"

      - name: "Smoke: open-loop resimulation from the recorded log"
        shell: bash
        run: cargo run -q -p continuo-examples --example traffic_resim -- ci-run.jsonl

      # The viewer's own tests build their logs from synthetic events. This is
      # the only check that it reads what the conductor actually writes, which
      # is the half a schema change would break.
      - name: "Smoke: replay the recorded log through the viewer"
        shell: bash
        run: |
          summary=$(python -m continuo_viz --log ci-run.jsonl --check)
          echo "$summary"

          # What the viewer parsed, against a crude count of the same file.
          # Nothing here depends on what the scenario does: both sides move
          # together when the demo changes, and disagree only if the viewer
          # stops understanding one of the log's kinds of line.
          messages=$(printf '%s\n' "$summary" | sed -n 's/.*messages seen *: *//p')
          membership=$(printf '%s\n' "$summary" | sed -n 's|.*joins / leaves *: *||p')
          in_log=$(grep -c '^{"msg":' ci-run.jsonl)
          [ "$messages" = "$in_log" ]
          [ "$membership" = "$(grep -c '^{"join":' ci-run.jsonl) / $(grep -c '^{"leave":' ci-run.jsonl)" ]

          # Otherwise a log the viewer read nothing from would agree with a
          # log that contained nothing, and pass.
          [ "$in_log" -gt 0 ]

      # A smoke, not a benchmark: a shared runner cannot hold a rate steady
      # enough to assert one, so this checks that a large world still runs and
      # leaves the numbers for a human reading the log.
      #
      # Release, because the numbers it prints mean nothing from a debug build,
      # and `--no-default-features` so that costs a release build of 60 crates
      # rather than the 911 the viz feature brings in. This example needs none
      # of them.
      - name: "Smoke: a scaled world"
        run: >
          cargo run --release -p continuo-examples
          --no-default-features --example traffic_scale
