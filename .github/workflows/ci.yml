name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint, test, and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Two architectures and three libm implementations, chosen so that a
    # divergence says which of the two it came from. The world hash reaches
    # `sin`, `cos`, `asin`, and `atan2`, and IEEE 754 requires correct rounding
    # for `sqrt` but for none of those, so each is free to return different
    # last bits. `DEMO_WORLD_HASH` in the highway tests turns that into a
    # failure rather than something nobody looks at.
    #
    #   ubuntu-latest     x86_64  glibc     baseline
    #   windows-latest    x86_64  MSVC CRT  libm alone
    #   ubuntu-24.04-arm  arm64   glibc     architecture alone
    #   macos-latest      arm64   Apple     both together
    #
    # `fail-fast: false` earns its place here: one agent disagreeing is the
    # result, and cancelling the rest would throw away which agreed with what.
    #
    # Every one of these images ships LLVM, which is why no step installs
    # libclang: `fmi-sys` runs bindgen over the FMI 3.0 headers at build time
    # and needs it. Nothing asserts that they ship it, because the build
    # already fails on whichever agent stops doing so, which is the report
    # worth having. If one ever does, the fix is an install step on that
    # agent rather than all four, and README's Installing libclang section
    # has the packages.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Everything a step later needs is installed first, so a missing tool is
      # reported before any of the work rather than partway through it. All
      # three are cached; only the second ever compiles anything.
      - name: "Install: Rust (stable)"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Pinned by version, since a packager that changed under us would
      # rewrite modelDescription.xml on a commit that touched nothing. The
      # cache key carries the runner because the binary is native, and a miss
      # costs a release build of cargo-fmi, which is why it is cached at all.
      - name: "Install: cargo-fmi (cached)"
        uses: actions/cache@v6
        id: cargo-fmi-cache
        with:
          path: |
            ~/.cargo/bin/cargo-fmi
            ~/.cargo/bin/cargo-fmi.exe
          key: cargo-fmi-0.3.0-${{ runner.os }}-${{ runner.arch }}

      - name: "Install: cargo-fmi (on a cache miss)"
        if: steps.cargo-fmi-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-fmi --version 0.3.0 --locked

      # The viewer installs with plain `pip`, not `uv`. `uv.lock` is committed
      # as a convenience and nothing requires it, so installing the ordinary
      # way is what keeps that true.
      - name: "Install: Python (cached)"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: "Install: viewer"
        working-directory: python
        run: python -m pip install -e . pytest ruff

      # fmpy validates what the FMU steps below package, and is nothing to do
      # with the viewer, so it gets an environment of its own. It brings numpy
      # and lxml among others, and sharing one would run the viewer's tests
      # against a tree nobody who installs the viewer has, where an accidental
      # import of any of it passes here and fails for them.
      - name: "Install: fmpy"
        shell: bash
        run: |
          # Install fmpy in a virtual environment, named for the later steps.
          python -m venv .venv-fmpy
          if [ -x .venv-fmpy/bin/python ]; then
            fmpy_python=.venv-fmpy/bin/python     # Linux and macOS
          else
            fmpy_python=.venv-fmpy/Scripts/python # Windows
          fi
          "$fmpy_python" -m pip install fmpy
          echo "FMPY_PYTHON=$fmpy_python" >> "$GITHUB_ENV"

      # Lints run before anything is built for real, cheapest first, so an
      # unformatted file is reported in seconds rather than after a compile.
      # Steps only run when every earlier one succeeded.
      - name: "Lint: format"
        run: cargo fmt --all --check

      # `--all-features` so a target held behind one is still linted. The
      # packaged-FMU comparison is such a target, and it would otherwise be
      # the one file in the workspace nothing here reads.
      - name: "Lint: clippy"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Catches broken intra-doc links, which nothing else does: the crates
      # cross-reference each other heavily, and a renamed item leaves a link
      # that still compiles.
      - name: "Lint: docs"
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: "Lint: ruff"
        working-directory: python
        run: |
          ruff check .
          ruff format --check .

      # A build of its own, so a compile error is reported as one rather than
      # as whichever test step reached it first. `--all-features` for the same
      # reason clippy takes it: a target behind a feature compiles here rather
      # than in whichever later step first needs it.
      - name: "Build: debug"
        run: cargo build --workspace --all-targets --all-features

      # Before the tests, because one of them loads the `.fmu` this writes.
      # Packaging after them would need a second cargo run for that one
      # test, and asking for a single target resolves fewer packages, which
      # changes their dependencies' features and rebuilds much of the graph.
      #
      # Names no package: the task finds every `continuo-fmu-*` crate
      # itself, so a second FMU crate needs no edit here.
      - name: "FMU: package"
        run: cargo xtask package-fmus

      # Validate with fmpy to get an independent check on the correctness of
      # the packaged FMUs. The glob is guarded because one matching nothing
      # expands to itself, and naming the empty directory beats fmpy failing
      # to open a path with a star in it.
      - name: "FMU: validate"
        shell: bash
        run: |
          # Validate every packaged FMU with fmpy.
          packaged=(target/fmu/*.fmu)
          if [ ! -e "${packaged[0]}" ]; then
            echo "ERROR: no .fmu in target/fmu; the packaging step produced none"
            exit 1
          fi
          for fmu in "${packaged[@]}"; do
            "$FMPY_PYTHON" -m fmpy validate "$fmu"
          done

      # `--lib` and `--test '*'` partition the suite: the first runs the unit
      # tests inside each lib, the second the integration targets in tests/.
      # Note `--tests` would *not* work as the second half, because it
      # includes lib unit tests too, so the two steps would re-run them.
      #
      # `--all-features` matches the build above, so neither step compiles
      # anything: a changed feature list alone makes cargo rebuild a crate.
      # It is also what runs the packaged-FMU comparison, one of the
      # integration targets.
      - name: "Test: unit"
        run: cargo test --workspace --all-features --lib

      - name: "Test: integration"
        run: cargo test --workspace --all-features --test '*'

      # Through `python -m` rather than the `pytest` on the path, so the
      # interpreter running the tests is the one the viewer was installed
      # into. A `pytest` shim from some other environment would collect these
      # files and fail to import what they need.
      - name: "Test: viewer"
        working-directory: python
        run: python -m pytest -v

      # Release from here on, so the smokes run against the profile the
      # packaged FMU was built at and will be loaded beside. Packaging above
      # asks for `--release` itself, since a host loads the binary it finds
      # and cannot rebuild it.
      - name: "Build: release"
        run: cargo build --release --workspace --examples

      # The world hash is pinned by a test that runs debug, and everything
      # after this point runs release, so this is what carries the pin across
      # to the other profile. rustc does not reassociate float arithmetic at
      # any optimization level, which is why the two agree; this is what would
      # notice if that stopped being true, on whichever agent it stopped on.
      - name: "Test: the world hash holds in release too"
        shell: bash
        run: |
          # Run the demo under both profiles and compare the hash it prints.
          debug_hash=$(cargo run -q -p continuo-examples --example traffic \
            | sed -n 's/.*world hash \([0-9a-f]*\).*/\1/p')
          release_hash=$(cargo run -q --release -p continuo-examples --example traffic \
            | sed -n 's/.*world hash \([0-9a-f]*\).*/\1/p')
          echo "debug $debug_hash, release $release_hash"

          # Two empty captures would otherwise match, so a demo that stopped
          # printing its hash would pass this rather than fail it.
          if [ -z "$debug_hash" ]; then
            echo "ERROR: no world hash in the demo's output; this check would be vacuous"
            exit 1
          fi
          if [ "$debug_hash" != "$release_hash" ]; then
            echo "ERROR: the world hash differs between profiles"
            exit 1
          fi

      # Smoke steps run the shipped examples end to end, covering what the
      # test suites cannot: that the examples themselves build and run, and
      # that the artefacts one produces are what the next consumes. They are
      # ordered and share state, since the log recorded below is read by both
      # steps after it. A failure aborts the rest of the job, because steps
      # only run when every earlier one succeeded.
      #
      # New end-to-end checks belong here, with the same "Smoke:" prefix.
      - name: "Smoke: traffic demo"
        run: cargo run --release -p continuo-examples --example traffic

      - name: "Smoke: record a run and verify the unmodified log"
        shell: bash
        run: |
          cargo run -q --release -p continuo-examples --example traffic_record -- ci-run.jsonl
          cargo run -q --release -p continuo-examples --example traffic_verify -- ci-run.jsonl

      # `verification_stops_at_the_first_divergence` in the highway tests
      # already checks that a tampered log is rejected, where it can be run
      # and debugged locally. This step is here for the one thing a test
      # cannot reach: the example's exit code. A `main` that reported the
      # divergence and returned zero would still pass that test.
      #
      # Neither `if` below can become `! cmd`. Bash exempts an inverted
      # command from `set -e`, so the short form would never fail the step.
      #
      # The awk corrupts one pose x-coordinate mid-run, at the first match on
      # or after line 6000 (roughly sim time 14 s of 30), keeping the JSON
      # valid, so verification checks a long clean prefix before diverging
      # and stops there rather than running to completion.
      - name: "Smoke: verification detects a modified log"
        shell: bash
        run: |
          # Corrupt one pose mid-run, then check verification rejects the log.
          awk 'NR>=6000 && !done && /"x":/ { sub(/"x":[-0-9.eE]*/, "\"x\":99.9"); done=1 } { print }' \
            ci-run.jsonl > ci-tampered.jsonl
          if cmp -s ci-run.jsonl ci-tampered.jsonl; then
            echo "ERROR: awk matched nothing, log was NOT modified; this check would be vacuous"
            exit 1
          fi
          if cargo run -q --release -p continuo-examples --example traffic_verify -- ci-tampered.jsonl; then
            echo "ERROR: verification PASSED on the modified log; divergence was NOT detected"
            exit 1
          fi

      - name: "Smoke: open-loop resimulation from the recorded log"
        shell: bash
        run: cargo run -q --release -p continuo-examples --example traffic_resim -- ci-run.jsonl

      # The viewer's own tests build their logs from synthetic events. This is
      # the only check that it reads what the conductor actually writes, which
      # is the half a schema change would break. No test can take it over: the
      # log is written by Rust and read by Python.
      #
      # So the labels it reads are a contract. Reword one and this step fails
      # on a change that touched nothing else. `run_check` says so where they
      # are printed.
      - name: "Smoke: replay the recorded log through the viewer"
        shell: bash
        run: |
          summary=$(python -m continuo_viz --log ci-run.jsonl --check)
          echo "$summary"

          # What the viewer parsed, against a crude count of the same file.
          # Nothing here depends on what the scenario does: both sides move
          # together when the demo changes, and disagree only if the viewer
          # stops understanding one of the log's kinds of line.
          messages=$(printf '%s\n' "$summary" | sed -n 's/.*messages seen *: *//p')
          membership=$(printf '%s\n' "$summary" | sed -n 's|.*joins / leaves *: *||p')
          in_log=$(grep -c '^{"msg":' ci-run.jsonl)
          [ "$messages" = "$in_log" ]
          [ "$membership" = "$(grep -c '^{"join":' ci-run.jsonl) / $(grep -c '^{"leave":' ci-run.jsonl)" ]

          # Otherwise a log the viewer read nothing from would agree with a
          # log that contained nothing, and pass.
          [ "$in_log" -gt 0 ]

      # What a clip should contain is asserted in the viewer's own tests, which
      # can be run and linted. This is here for what those cannot reach: the
      # command line, drawing with no display attached, and a log the conductor
      # really wrote rather than one a test built.
      - name: "Smoke: record a clip of the log"
        shell: bash
        run: |
          python -m continuo_viz --log ci-run.jsonl --record ci-clip.gif \
            --record-from 18 --record-seconds 1
          test -s ci-clip.gif

      # A smoke, not a benchmark: a shared runner cannot hold a rate steady
      # enough to assert one, so this checks that a large world still runs and
      # leaves the numbers for a human reading the log.
      - name: "Smoke: a scaled world"
        run: cargo run --release -p continuo-examples --example traffic_scale

      # Last, because publishing is the one thing here that leaves the job.
      # A step only runs when every earlier one succeeded, so an FMU reaches
      # the merge workflow only from a run that passed all of it.
      #
      # Every FMU the workspace packages, each carrying this platform's
      # binary alone. One artifact per platform rather than per FMU, because
      # an upload step produces one artifact and a workflow cannot loop over
      # steps, so a name per FMU would mean a step per FMU to keep updated.
      # The merge workflow groups them by file name instead.
      - name: "FMU: upload"
        uses: actions/upload-artifact@v7
        with:
          name: fmus-${{ runner.os }}-${{ runner.arch }}
          path: target/fmu/*.fmu
          # A step that collected nothing would otherwise pass.
          if-no-files-found: error
