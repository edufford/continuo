[package]
name = "continuo-fmi"
description = "Runs an imported FMI 3.0 Co-Simulation FMU as a component"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
continuo-core = { workspace = true }
fmi = { workspace = true }
# For `Value` as the in-memory payload model and for JSON Pointer resolution,
# not for encoding: encoding and decoding go through core, which is what keeps
# the wire format out of this crate.
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `fmi` logs through `log`; tracing-subscriber's default `tracing-log`
# feature bridges that into tracing, which is what the rest of the workspace
# uses. An FMU's own diagnostics are otherwise invisible.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
