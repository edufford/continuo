[package]
name = "continuo-viz-bridge"
description = "Relays a run's published messages to a live viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# On by default because publishing to a live viewer is what this crate is
# for, so an ordinary build compiles the Zenoh sink. That sink has no tests of
# its own, since exercising it needs a live session and two processes, so
# compiling is the only thing standing between it and rot. Zenoh is 300-odd
# transitive crates against the workspace's 21 and pulls an async runtime,
# which is what that costs.
#
# Still a feature rather than a plain dependency: everything except that sink
# works without it, so `--no-default-features` gives a bridge that can still
# frame messages and write them to a log.
default = ["zenoh"]
zenoh = ["dep:zenoh"]

[dependencies]
continuo-core = { workspace = true }
continuo-transport = { workspace = true }
continuo-conductor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zenoh = { workspace = true, optional = true }
