[workspace]
resolver = "3"
# `xtask` sits outside `crates/` because it is tooling for this
# checkout rather than part of what the workspace publishes.
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
continuo-core = { path = "crates/continuo-core" }
continuo-transport = { path = "crates/continuo-transport" }
continuo-conductor = { path = "crates/continuo-conductor" }
continuo-actors = { path = "crates/continuo-actors" }
continuo-viz-bridge = { path = "crates/continuo-viz-bridge" }
continuo-fmi = { path = "crates/continuo-fmi" }
continuo-fmu-controller-idm = { path = "crates/continuo-fmu-controller-idm" }
# Default also pulls FMI 2.0 and the layered LS-BUS standard, neither of which
# this workspace imports.
fmi = { version = "0.8", default-features = false, features = ["fmi3"] }
# Authoring side of the same upstream workspace. It depends on `fmi` in turn,
# so an FMU crate pays for bindgen exactly as the importer does.
fmi-export = "0.3"
# A pure-Rust port of MUSL's libm, so `sin` and its neighbours are the same
# bits on every platform rather than whatever that platform's C library
# rounds to. Pinned through Cargo.lock, since a different version of it is
# a different fingerprint.
libm = "0.2"
# Property-based testing: a strategy generates the cases and a failure
# shrinks to the smallest one it can find. Test-only, so nothing it draws
# reaches a fingerprint. Pinned through Cargo.lock like libm, since a
# persisted regression seed replays its case only under the generator
# that drew it.
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
zenoh = "1.9"

# `fmi-export-derive` pulls in `proc-macro-error2`, which re-exports a private
# `extern crate proc_macro`. rustc will make that an error, and until then it
# warns on every build that touches the FMU crate:
# https://github.com/rust-lang/rust/issues/127909
#
# The crate is archived and will not be updated again, so 2.0.1 is the last
# release there will ever be and there is nothing to upgrade to. This pins the
# two-line fix rustc's own help suggests, from the pull request that was still
# open when the repository was archived:
# https://github.com/GnomedDev/proc-macro-error-2/pull/14
#
# By revision rather than by branch, so what builds here is the commit that was
# read rather than wherever the branch points later. It goes when `fmi-export`
# stops depending on the crate, which is the only thing that ends this
# properly.
[patch.crates-io]
proc-macro-error2 = { git = "https://github.com/fgardt/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }
