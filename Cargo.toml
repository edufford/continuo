[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
continuo-core = { path = "crates/continuo-core" }
continuo-transport = { path = "crates/continuo-transport" }
continuo-conductor = { path = "crates/continuo-conductor" }
continuo-actors = { path = "crates/continuo-actors" }
continuo-viz-bridge = { path = "crates/continuo-viz-bridge" }
continuo-fmi = { path = "crates/continuo-fmi" }
continuo-fmu-controller-idm = { path = "crates/continuo-fmu-controller-idm" }
# Default also pulls FMI 2.0 and the layered LS-BUS standard, neither of which
# this workspace imports.
fmi = { version = "0.8", default-features = false, features = ["fmi3"] }
# Authoring side of the same upstream workspace. It depends on `fmi` in turn,
# so an FMU crate pays for bindgen exactly as the importer does.
fmi-export = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
zenoh = "1.9"
