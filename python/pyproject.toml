[project]
name = "continuo-viz"
version = "0.1.0"
description = "Viewer for continuo simulation runs, live or replayed from a log"
requires-python = ">=3.10"
# Deliberately empty. Reading a recorded log needs nothing but the standard
# library, which is what lets CI lint and test the parser and the scene
# without installing a display driver or a networking stack.
dependencies = []

[project.optional-dependencies]
# Drawing needs a window; watching a live run needs Zenoh. Neither is needed
# to parse a log, so neither is a hard dependency.
render = ["pygame>=2.5"]
live = ["eclipse-zenoh>=1.0"]

[project.scripts]
continuo-viz = "continuo_viz.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuo_viz"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
